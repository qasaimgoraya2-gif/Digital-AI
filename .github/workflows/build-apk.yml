name: Build Android Debug APK and Publish Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify active Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Android Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_TITLE="Q AI Debug APK v${{ github.run_number }}.${{ github.run_attempt }}"
          
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "Direct downloadable Android Debug APK for Q AI (Run #${{ github.run_number }}, Attempt #${{ github.run_attempt }})." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_TITLE="Q AI Debug APK v${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          APK_FILENAME="app-debug.apk"
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Confirming GitHub Release with gh release view..."
            gh release view "$RELEASE_TAG" || true
            
            echo "=================================================="
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${APK_FILENAME}"
            echo "=================================================="
            
            echo "### 🚀 APK Release Published Successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`${RELEASE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Title:** ${RELEASE_TITLE}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Release Page:** [View Release and Download APK](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Asset Filename:** \`${APK_FILENAME}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The APK can be downloaded directly under the release **Assets** section." >> "$GITHUB_STEP_SUMMARY"
            echo "The normal Actions artifact (\`app-debug-apk\`) is also available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not complete successfully."
            echo "Notice: The APK build and upload succeeded. The Actions artifact named 'app-debug-apk' remains available for download."
            
            echo "### ⚠️ Notice: Release Publishing Warning" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Build:** Succeeded ✅" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact:** The artifact named \`app-debug-apk\` was successfully uploaded and remains available for download." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Publishing Status:** Release publishing encountered an issue or was skipped, but the compiled APK is preserved safely in the Actions artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi
